# 打 tag 自动构建并发布 release。
#
# 三个已踩过的坑（写在这里免得下次重犯）：
#  1. 不要用 android-actions/setup-android@v3 —— 它内部跑 `sdkmanager tools`，
#     而 Google 已移除独立 tools 包，该 action 会误判为致命错误并中止。
#     runner 镜像自带 SDK，自己装需要的包即可。
#  2. `find` 找 sdkmanager 的 -maxdepth 必须够深（<sdk>/cmdline-tools/<ver>/bin/sdkmanager），
#     否则变量为空、下一行变成空命令，报错位置离真因极远。配合 -print -quit 取第一个匹配。
#  3. `set -o pipefail` 下 `find | head -1` 会因为 SIGPIPE 自杀，所以用 -print -quit。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName（留空则用 tag 去掉 v）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 见文件头「坑 1」：不用 setup-android action，直接装包
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          CMDLINE="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -print -quit || true)"
          if [ -z "$CMDLINE" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -R "$SDK/cmdline-tools" || true
            exit 1
          fi
          echo "sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CMDLINE" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 签名密钥来自仓库 secret（base64 的 PKCS12），不写进命令文本以免落日志
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 secret DSH_KEYSTORE_B64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=dsh"
            echo "keyPassword=$STORE_PASSWORD"
          } > keystore.properties
          ls -l release.keystore keystore.properties

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature and write checksums
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/36.0.0"

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then echo "::error::没有产出 APK"; exit 1; fi
          echo "APK=$APK"

          VERSION="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1 || true)"
          if [ -z "${VERSION:-}" ]; then VERSION="unknown"; fi
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # 签名必须独立验，别只看 job 是绿的
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" || true

          mkdir -p release
          cp "$APK" "release/Tdsh-${VERSION}.apk"
          cd release
          sha256sum "Tdsh-${VERSION}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 发布说明：直接从 CHANGELOG.md 里抠出**这一版**那一节。
      #
      # 为什么不用 action 自动生成的 notes：那只是一串 commit 标题，
      # 而本项目的 CHANGELOG 才是给用户看的（每版都写了"改了什么、为什么、怎么验证"）。
      # 少维护一份 release notes，也就不会出现"发布页和 CHANGELOG 说法不一致"。
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - "${VERSION#v}" <<'PYEOF' > release/RELEASE_NOTES.md
          import os, re, sys
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # 章节标题形如 "## v0.4.11-fz1"；取到下一个 "## " 之前
          pat = re.compile(r'^## +v?' + re.escape(ver) + r'\s*$', re.M)
          m = pat.search(text)
          if not m:
              print("（本版没有在 CHANGELOG.md 里找到 v%s 小节，以下是完整更新日志链接。）" % ver)
              print()
              print("https://github.com/%s/blob/main/CHANGELOG.md" % os.environ.get('GITHUB_REPOSITORY', ''))
              sys.exit(0)
          rest = text[m.end():]
          nxt = re.search(r'^## ', rest, re.M)
          body = rest[:nxt.start()] if nxt else rest
          print(body.strip())
          PYEOF
          # 正文顶部补一句"装哪个文件、怎么装"
          {
            echo "## 安装"
            echo
            echo "- 下载下面的 \`Tdsh-${VERSION#v}.apk\`，传到手机上点击安装（仅 arm64，Android 7.0+）。"
            echo "- 与上一版**同签名**，可直接覆盖安装，不会清空容器、API Key 与白名单。"
            echo "- 校验：下载后比对 \`SHA256SUMS.txt\`。"
            echo
            echo "---"
            echo
            cat release/RELEASE_NOTES.md
          } > release/RELEASE_NOTES.tmp && mv release/RELEASE_NOTES.tmp release/RELEASE_NOTES.md
          echo "---- notes 前 20 行 ----"
          head -20 release/RELEASE_NOTES.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            release/*.apk
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          body_path: release/RELEASE_NOTES.md
          fail_on_unmatched_files: true
