# 日常构建：不依赖任何签名 secret，push 就出一个**可安装的 debug APK**。
#
# 为什么单独一个工作流（和 release.yml 分开）：
#   release.yml 是"发版"用的，它硬性要求 DSH_KEYSTORE_B64 —— 没有就 ::error:: 退出。
#   而改代码、验编译这类日常动作不该被"没有密钥"挡住：debug 包由 AGP 自动生成的
#   debug keystore 签名，装上就能跑，正好用来在真机上量启动时间。
#
# 三个已踩过的坑（与 release.yml 保持一致，别各写一套）：
#   1. 不用 android-actions/setup-android@v3 —— 它内部跑 `sdkmanager tools`，
#      而 Google 已移除独立 tools 包，该 action 会误判为致命错误并中止。
#   2. 找 sdkmanager 的 -maxdepth 必须够深，否则变量为空、下一行变成空命令，
#      报错位置离真因极远。配合 -print -quit 取第一个匹配。
#   3. `set -o pipefail` 下 `find | head -1` 会因为 SIGPIPE 自杀，所以用 -print -quit。

name: build

on:
  push:
    branches: [ main, 'perf/**' ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只跑最新一次：连续 push 时旧的自动取消（省 runner 额度，也省等待）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          CMDLINE="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -print -quit || true)"
          if [ -z "$CMDLINE" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -R "$SDK/cmdline-tools" || true
            exit 1
          fi
          echo "sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CMDLINE" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 有没有发布签名密钥，决定这次能不能顺带出一个 release 包。
      # （secrets 不能直接写在 if 里，所以先落到 step output。）
      - name: Detect signing secret
        id: sign
        env:
          K: ${{ secrets.DSH_KEYSTORE_B64 }}
        run: |
          if [ -n "${K:-}" ]; then echo "have=1" >> "$GITHUB_OUTPUT"; else echo "have=0" >> "$GITHUB_OUTPUT"; fi

      - name: Restore signing keystore
        if: steps.sign.outputs.have == '1'
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=dsh"
            echo "keyPassword=$STORE_PASSWORD"
          } > keystore.properties

      # 关键：先单独出 debug 包。它不需要任何 secret，
      # 也就是"改了代码到底能不能编过"这件事永远有人替你验。
      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK (only when keystore is available)
        if: steps.sign.outputs.have == '1'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/36.0.0"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Report APK facts
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/36.0.0"
          for f in $(find app/build/outputs/apk -maxdepth 2 -name '*.apk'); do
            echo "== $f ($(stat -c%s "$f") bytes)"
            "$BT/aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)" || true
            sha256sum "$f"
          done
          # 把 versionCode/versionName 明确写进日志：和 CHANGELOG 对账时不用再翻 build.gradle
          echo "== build.gradle 版本"
          grep -E "versionCode|versionName" app/build.gradle | head -4

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.sign.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
