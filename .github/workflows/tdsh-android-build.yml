# Tdsh Android（tdsh-android/）日常构建：不需要任何签名 secret，push 就出可安装 debug APK。
#
# 与仓库根目录的 release.yml（合并 Termux 版）互不影响：
#   · 本工作流只关心 tdsh-android/** 的改动；
#   · 产物名带 tdsh-android 前缀，避免和合并版的 artifact 撞名。
name: tdsh-android-build

on:
  push:
    branches: [ main ]
    paths:
      - 'tdsh-android/**'
      - '.github/workflows/tdsh-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdsh-android-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tdsh-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3（它内部跑 sdkmanager tools，Google 已移除该包）
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMDLINE="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -print -quit || true)"
          if [ -z "$CMDLINE" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes | "$CMDLINE" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CMDLINE" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Detect signing secret
        id: sign
        env:
          K: ${{ secrets.DSH_KEYSTORE_B64 }}
        run: |
          if [ -n "${K:-}" ]; then echo "have=1" >> "$GITHUB_OUTPUT"; else echo "have=0" >> "$GITHUB_OUTPUT"; fi

      - name: Restore signing keystore
        if: steps.sign.outputs.have == '1'
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=dsh"
            echo "keyPassword=$STORE_PASSWORD"
          } > keystore.properties

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK (only when keystore is available)
        if: steps.sign.outputs.have == '1'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Report APK facts
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/36.0.0"
          for f in $(find app/build/outputs/apk -maxdepth 2 -name '*.apk'); do
            echo "== $f ($(stat -c%s "$f") bytes)"
            "$BT/aapt2" dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion)" || true
            sha256sum "$f"
          done
          grep -E "versionCode|versionName" app/build.gradle | head -4

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tdsh-android-apk-debug
          path: tdsh-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.sign.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: tdsh-android-apk-release
          path: tdsh-android/app/build/outputs/apk/release/*.apk
