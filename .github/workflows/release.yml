name: Build APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install NDK and SDK components
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;35.0.0"
          echo "--- ndk:"; ls "$ANDROID_HOME/ndk"
          echo "--- platforms:"; ls "$ANDROID_HOME/platforms"

      - name: Build shell APK (com.dsh.mobile)
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Generate patched bootstrap
        working-directory: termux
        run: |
          set -e
          # bootstrap 不再入库（29 MB 的二进制，每次改动都会让仓库膨胀），
          # 构建前从上游下载并改写前缀 + 注入 apt 钩子。
          python3 tools/build-bootstrap.py --ndk "$ANDROID_HOME/ndk/29.0.14206865"
          ls -lh app/src/main/cpp/bootstrap-aarch64.zip

      - name: Build merged APK (com.dshapp, built-in Termux)
        working-directory: termux
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          echo "--- 外壳产物:"; find android/app/build/outputs/apk -name '*.apk' -print
          echo "--- 合并版产物:"; find termux/app/build/outputs/apk -name '*.apk' -print

          SHELL_APK=$(find android/app/build/outputs/apk -name '*.apk' | sort | head -1)
          MERGED_APK=$(find termux/app/build/outputs/apk -name '*.apk' | sort | head -1)

          [ -n "$SHELL_APK" ]  || { echo "未找到外壳 APK"; exit 1; }
          [ -n "$MERGED_APK" ] || { echo "未找到合并版 APK"; exit 1; }

          cp "$SHELL_APK"  out/DSH-Mobile-shell.apk
          cp "$MERGED_APK" out/DSH-Mobile-merged-arm64.apk

          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apks
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Mobile ${{ github.ref_name }}
          body: |
            DSH 安卓端。

            - `DSH-Mobile-shell.apk` — 纯前端外壳（com.dsh.mobile），连接 Termux 中的 DSH 主机
            - `DSH-Mobile-merged-arm64.apk` — 内置 Termux 的合并版（com.dshapp），仅 arm64-v8a

            两者均为 debug 签名，可直接侧载安装。
          files: out/*
