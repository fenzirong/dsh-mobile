name: Build APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865"
          echo "NDK: $ANDROID_HOME/ndk/29.0.14206865"
          ls "$ANDROID_HOME/ndk/29.0.14206865" | head

      - name: Build shell APK (com.dsh.mobile)
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build merged APK (com.dshapp, built-in Termux)
        working-directory: termux
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/DSH-Mobile-shell.apk
          cp termux/app/build/outputs/apk/debug/app-debug.apk out/DSH-Mobile-merged-arm64.apk
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apks
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Mobile ${{ github.ref_name }}
          body: |
            DSH 安卓端。

            - `DSH-Mobile-shell.apk` — 纯前端外壳（com.dsh.mobile），连接 Termux 中的 DSH 主机
            - `DSH-Mobile-merged-arm64.apk` — 内置 Termux 的合并版（com.dshapp），仅 arm64-v8a

            两者均为 debug 签名，可直接侧载安装。
          files: out/*
